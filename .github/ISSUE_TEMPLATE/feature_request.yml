name: Feature request
description: Propose a capability, a new SDK adapter, or a workflow improvement.
title: "[Feature] "
labels:
  - needs-triage
body:
  - type: markdown
    attributes:
      value: |
        Beacon is SDK-agnostic by design: SDK knowledge enters through registry sources and platform
        providers, not through the framework layer. Please describe your request in those terms if you
        can.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you unable to do today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What should change? If it touches protocol, schema, report shape, or a validation gate, say so explicitly.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      multiple: true
      options:
        - agent core (C++)
        - macOS adapter / Agora backend
        - server control plane
        - Python authoring SDK
        - Mac test console
        - SDK registry / adapters
        - verification gates and coverage
        - documentation
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Including any workaround you already use.
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I checked existing issues and the roadmap for an overlapping request.
          required: true
