[project]
name = "beacon-server"
version = "0.1.0"
description = "Beacon control plane: device registry, command dispatch, evidence collection, and test report generation."
license = "MIT"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "httpx>=0.27",
  "jsonschema>=4",
  "pydantic>=2",
  "uvicorn>=0.27",
  "websockets>=15",
]

[project.optional-dependencies]
# agora extra 只装 SDK 专有的 token 签发依赖；Server 核心不依赖任何具体 SDK。
agora = [
  "agora-token-builder>=1.0.0",
]
test = [
  "pytest>=8",
  "pyyaml>=6",
  "coverage>=7",
]
type = [
  "mypy>=1.18",
  "types-jsonschema>=4",
]

[tool.pytest.ini_options]
testpaths = ["tests", "../python_sdk/tests", "../tests"]
pythonpath = [".", "..", "../python_sdk"]
