case_id: TC-MAC-AGORA-1V1-REMOTE-VIDEO-RENDERED
name: macOS Agora 1V1 bidirectional remote video rendered
platform: mac
suite: agora_direct_call_enhanced
scenario_family: direct_call
implementation_status: runnable
covered_capabilities:
  - remote_video_rendering
steps:
  - step_id: primary-setup-local-video-for-1v1-visual-call
    packet:
      common:
        action: invokeRequest
        op_id: op-agora-1v1-visual-primary-setup-local-video
        timestamp_ms: 1770000005000
      data:
        device_role: primary
        sync: true
        list:
          - target:
              sdk: agora_rtc
              interface: rtc_engine
              class_name: AgoraRtcEngineKit
              function: setupLocalVideo
            params:
              view_id: primary_local_preview
            extra: {}
  - step_id: primary-start-preview-for-1v1-visual-call
    packet:
      common:
        action: invokeRequest
        op_id: op-agora-1v1-visual-primary-start-preview
        timestamp_ms: 1770000005005
      data:
        device_role: primary
        sync: true
