    packet:
      common:
        action: invokeRequest
        op_id: op-agora-1v1-visual-primary-join
        timestamp_ms: 1770000005010
      data:
        device_role: primary
        sync: true
        list:
          - target:
              sdk: agora_rtc
              interface: rtc_engine
              class_name: AgoraRtcEngineKit
              function: joinChannel
            params:
              channel: real-smoke-1v1-visual
              uid: 1001
              token: "{{AGORA_RTC_TOKEN}}"
              auto_subscribe_audio: true
              auto_subscribe_video: true
              publish_camera: true
              publish_microphone: true
            extra: {}
    assertions:
      - type: event_exists
        target:
          sdk: agora_rtc
          interface: rtc_engine
          class_name: AgoraRtcEngineDelegate
          function: onJoinChannelSuccess
        timeout_ms: 5000
