case_id: TC-MAC-AGORA-CONNECTION-STATE-SEQUENCE
name: macOS Agora L1 connection state sequence
platform: mac
suite: agora_direct_call_l1
scenario_family: direct_call
implementation_status: runnable
covered_capabilities:
  - connection_state_transition
steps:
  - step_id: join-and-observe-state-sequence-start
    packet:
      common:
        action: invokeRequest
        op_id: op-agora-l1-sequence-join
        timestamp_ms: 1770000002700
      data:
        node_id: mac-real-e2e-001
        sync: true
        list:
          - target:
              sdk: agora_rtc
              interface: rtc_engine
              class_name: AgoraRtcEngineKit
              function: joinChannel
            params:
              channel: real-smoke-sequence
              uid: 1001
              token: "{{AGORA_RTC_TOKEN}}"
            extra: {}
    assertions:
      - type: event_exists
        target:
          sdk: agora_rtc
          interface: rtc_engine
          class_name: AgoraRtcEngineDelegate
          function: onConnectionStateChanged
        timeout_ms: 5000
      - type: event_exists
        target:
          sdk: agora_rtc
          interface: rtc_engine
          class_name: AgoraRtcEngineDelegate
          function: onJoinChannelSuccess
        timeout_ms: 5000
  - step_id: leave-and-observe-state-sequence-end
    packet:
      common:
        action: invokeRequest
        op_id: op-agora-l1-sequence-leave
        timestamp_ms: 1770000002750
      data:
        node_id: mac-real-e2e-001
        sync: true
        list:
          - target:
              sdk: agora_rtc
              interface: rtc_engine
              class_name: AgoraRtcEngineKit
              function: leaveChannel
            params: {}
            extra: {}
  - step_id: assert-not-joined-after-state-sequence-leave
    packet:
      common:
        action: invokeRequest
        op_id: op-agora-l1-sequence-is-joined
        timestamp_ms: 1770000002800
      data:
        node_id: mac-real-e2e-001
        sync: true
        list:
          - target:
              sdk: agora_rtc
              interface: rtc_engine
              class_name: AgoraRtcEngineKit
              function: isJoined
            params: {}
            extra: {}
    assertions:
      - type: state_equals
        target:
          sdk: agora_rtc
          interface: rtc_engine
          class_name: AgoraRtcEngineKit
          function: isJoined
        value: false
        timeout_ms: 5000
