case_id: TC-MAC-AGORA-JOIN-CALLBACK-TIMEOUT
name: macOS Agora join callback timeout
platform: mac
suite: agora_failure_recovery_resilience
scenario_family: failure_recovery
implementation_status: runnable
covered_capabilities:
  - join_callback_timeout
steps:
  - step_id: load-sdk-before-join-callback-timeout
    packet:
      common:
        action: invokeRequest
        op_id: op-agora-join-timeout-load-sdk
        timestamp_ms: 1770000004400
      data:
        node_id: mac-real-e2e-001
        sync: true
        list:
          - target:
              sdk: agora_rtc
              interface: rtc_engine
              class_name: SDKLifecycle
              function: loadSDK
            params: {}
            extra: {}
  - step_id: join-channel-with-suppressed-success-callback
    packet:
      common:
        action: invokeRequest
        op_id: op-agora-join-timeout-join
        timestamp_ms: 1770000004500
      data:
        node_id: mac-real-e2e-001
        sync: true
        list:
          - target:
              sdk: agora_rtc
              interface: rtc_engine
              class_name: AgoraRtcEngineKit
              function: joinChannel
            params:
              channel: join-timeout-smoke
              uid: 1004
              token: "{{AGORA_RTC_TOKEN}}"
            extra:
              callback_fixture: suppress_join_success_for_testing
    assertions:
      - type: event_exists
        target:
          sdk: agora_rtc
          interface: rtc_engine
          class_name: AgoraRtcEngineDelegate
          function: onJoinChannelSuccess
        timeout_ms: 5000
      - type: failure_classification
        value:
          category: timeout
          source: assertion
          assertion_type: event_exists
